name: Build APK and JAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    name: NeoForge mod JAR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod JAR
        run: ./gradlew --no-daemon clean build

      - name: Show JAR artifacts
        run: ls -lh build/libs

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: glesmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  apk:
    name: FCL renderer plugin APK
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;27.2.12479018
            cmake;3.22.1
          accept-android-sdk-licenses: true

      - name: Show Android toolchain
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME -and $env:ANDROID_SDK_ROOT) {
            $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
            Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_HOME=$env:ANDROID_HOME"
          }
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Get-ChildItem "$env:ANDROID_HOME\ndk" -Directory | Select-Object -ExpandProperty Name
          Get-ChildItem "$env:ANDROID_HOME\cmake" -Directory | Select-Object -ExpandProperty Name

      - name: Build native libraries (arm64-v8a)
        shell: pwsh
        run: .\native\build-native.ps1 -Abi arm64-v8a

      - name: Build native libraries (armeabi-v7a)
        shell: pwsh
        run: .\native\build-native.ps1 -Abi armeabi-v7a

      - name: Verify native symbols and plugin wiring
        shell: pwsh
        run: |
          python native\tools\check_proxy_emulation.py
          python native\tools\check_plugin_v2.py
          python native\tools\verify_doc_claims.py
          python native\tools\check_symbols.py --lib build\native\arm64-v8a\libgl_gles.so --def native\symbols.def
          python native\tools\check_symbols.py --lib build\native\armeabi-v7a\libgl_gles.so --def native\symbols.def

      - name: Build and sign FCL renderer plugin APK
        shell: pwsh
        run: .\fcl-plugin\build-plugin.ps1 -SkipNative

      - name: Verify compiled APK v2 config and native markers
        shell: pwsh
        run: python native\tools\check_plugin_apk.py --apk build\plugin\glesmod-renderer-plugin.apk

      - name: Show APK artifacts
        shell: pwsh
        run: |
          Get-ChildItem build\plugin\*.apk | Format-Table Name, Length

      - name: Upload FCL renderer plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: glesmod-renderer-plugin-apk
          path: build/plugin/glesmod-renderer-plugin.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: glesmod-native-libs
          path: build/native/*/libgl_gles.so
          if-no-files-found: error
          retention-days: 14
